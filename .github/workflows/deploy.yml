name: Deploy static addon
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi beautifulsoup4 curl_cffi
      - uses: actions/cache@v4
        with:
          path: site
          key: greektv-site-${{ github.sha }}
          restore-keys: |
            greektv-site-
      - run: python static_export.py
      - run: test -s site/manifest.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site